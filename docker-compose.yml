#       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
#     volumes:
#       - driftguard-pg:/var/lib/postgresql/data
#
# Then point the API at it with DATABASE_URL and replace the sqlite3 calls in
